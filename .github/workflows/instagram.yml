name: Instagram poster
on:
  schedule:
    # publish.py only ever publishes posts dated today or earlier, and marks
    # them published as it goes, so every run after the first is a ~12s no-op.
    # That makes it safe to fire repeatedly. GitHub silently drops individual
    # scheduled runs under load — through Aug 27/28/31 the single 09:00 slot was
    # dropped three posting days running — so redundancy is the only defence.
    # Times are UTC; subtract 7 hours for Pacific while PDT is in effect.
    # (After the November clock change that becomes 8 hours. Campaign ends Sep 17.)
    - cron: '0 16 * * *'    # 09:00 PT — the intended slot
    - cron: '30 16 * * *'   # 09:30 PT
    - cron: '0 17 * * *'    # 10:00 PT
    - cron: '0 18 * * *'    # 11:00 PT
    - cron: '0 20 * * *'    # 13:00 PT
    - cron: '0 23 * * *'    # 16:00 PT — last chance to land same day
    # Sep 17: the campaign closes at 09:00 PT, so the final post has to be up
    # before that. Extra shots because there is no second chance on this one.
    - cron: '0 12 17 9 *'   # 05:00 PT
    - cron: '30 12 17 9 *'  # 05:30 PT
    - cron: '0 13 17 9 *'   # 06:00 PT
    - cron: '30 13 17 9 *'  # 06:30 PT
    - cron: '0 14 17 9 *'   # 07:00 PT
  workflow_dispatch:
    inputs:
      post_id:
        description: 'Post id to publish now (optional, e.g. 03_eisenkiesel)'
        required: false
      dry_run:
        description: 'Dry run (no publish)'
        type: boolean
        default: false
      fb_only:
        description: 'Mirror an already-published post to Facebook only'
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check token
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python ig/publish.py --check
      - name: Publish
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          FB_PAGE_ID: '349947451543285'
          POST_ID: ${{ inputs.post_id }}
          DRY_RUN: ${{ inputs.dry_run }}
          FB_ONLY: ${{ inputs.fb_only }}
        run: |
          ARGS=""
          if [ -n "$POST_ID" ]; then ARGS="--id $POST_ID --force"; fi
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "$FB_ONLY" = "true" ]; then ARGS="$ARGS --fb-only"; fi
          python ig/publish.py $ARGS | tee result.txt
      - name: Record result in queue.json
        run: |
          git config user.name "ig-poster"
          git config user.email "noreply@hypercubegames.com"
          git add ig/queue.json
          if git diff --cached --quiet; then echo "nothing published"; else git commit -m "post: $(grep PUBLISHED result.txt)" && git push; fi
